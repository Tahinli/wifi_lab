[package]
name = "wifi_lab"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
# GPUI UI (gpuikit's pinned gpui fork)
# gpuikit 0.9.0 predates API drift in newer gpui-unofficial builds — pin exact.
gpui = { package = "gpui-unofficial", version = "=1.14.2" }
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "=1.14.2" }
gpuikit = "0.9.0"

# GPU compute (PBKDF2-SHA1 handshake cracker)
wgpu = "30"
pollster = "0.4"

# Crypto (CPU reference + verification)
sha1 = "0.10"
hmac = "0.12"
pbkdf2 = "0.13"

# Backend plumbing
crossbeam-channel = "0.5"
libc = "0.2"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
byteorder = "1"
notify-rust = "4"

[profile.release]
debug = true

[[bin]]
name = "wifilab"
path = "src/main.rs"
